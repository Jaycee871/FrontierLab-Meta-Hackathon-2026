    text { font-family: Georgia, 'Times New Roman', Times, serif; fill: #F2F2F2; stroke: none; }
    .h { font-size: 15px; font-weight: bold; }
    .s { font-size: 13px; fill: #CFCFCF; }
    .it { font-size: 13px; font-style: italic; fill: #CFCFCF; }
    .sc { font-size: 10px; letter-spacing: 1px; fill: #CFCFCF; }
    .band { font-size: 12px; letter-spacing: 3px; }
  </style>
  <rect width="1200" height="400" fill="#1E1E1E"/>
  <text x="600" y="36" text-anchor="middle" class="it" font-size="14">“Upward, not Northward.”</text>
  <text x="102.4" y="148" text-anchor="start" font-size="60" font-weight="bold" letter-spacing="7" transform="skewX(-16)" style="fill:none;stroke:#F2F2F2;stroke-width:3.6;stroke-linejoin:round">FRONTIERLAB</text><text x="102.4" y="148" text-anchor="start" font-size="60" font-weight="bold" letter-spacing="7" transform="skewX(-16)" style="fill:#1E1E1E;stroke:none">FRONTIERLAB</text>
  <text x="64" y="190" font-size="17" letter-spacing="3">A ROMANCE OF MANY AGENTS</text>
  <text x="64" y="220" text-anchor="start" class="it" font-size="16">Evidence-grounded, human-gated multi-agent AI</text>
  <text x="64" y="242" text-anchor="start" class="it" font-size="16">for reviewable biomedical research plans</text>
