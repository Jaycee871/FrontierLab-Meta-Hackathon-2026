<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">FrontierLab: From Flatland to Spaceland</title>
  <desc id="hero-desc">Black-and-white book-plate banner, an homage to Edwin A. Abbott's Flatland. A riveted line segment, a triangle, a square and a hexagon filled with gears, belts, circuit traces and a heartbeat motif rise from a flat plane toward a sphere. The shapes stand for FrontierLab's model roles; the sphere is the human review gate. Markers show no, one, two and three dimensions.</desc>
  <defs><clipPath id="hc-tri"><polygon points="785,216 824.8,285 745.2,285"/></clipPath><clipPath id="hc-sq"><polygon points="860,170 930,170 930,240 860,240"/></clipPath><clipPath id="hc-hex"><polygon points="1050,150 1030,184.6 990,184.6 970,150 990,115.4 1030,115.4"/></clipPath></defs>
