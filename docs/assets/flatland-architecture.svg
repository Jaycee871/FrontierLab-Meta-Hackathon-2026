<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">FrontierLab architecture: From Flatland to Spaceland</title>
  <desc id="arch-desc">Pipeline diagram. Research question, evidence retrieval from Europe PMC and Springer Nature, optional Muse2-230M edge preprocessing, the Evidence Extraction Agent, and the deterministic verbatim evidence gate. An optional Llama 3.1 8B baseline runs the same contract for comparison. Figures and tables can pass an optional Liquid d1-2B multimodal evidence gate. All evidence then reaches the human review gate. Only after review do the Adversarial Skeptic Agent and Hypothesis Agent run, followed by researcher method evaluation, the planning gate, the plan draft and the JSON audit trail export.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1F1B16" stroke-width="1.4" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#9C3D24" stroke-width="1.4" stroke-dasharray="none"/>
    </marker>
  </defs>
  <style>
    .ink { fill: none; stroke: #1F1B16; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin { fill: none; stroke: #1F1B16; stroke-width: 0.8; }
    .flow { fill: none; stroke: #1F1B16; stroke-width: 1.1; }
    .opt { fill: none; stroke: #1F1B16; stroke-width: 1.1; stroke-dasharray: 5 4; }
    .accent { fill: none; stroke: #9C3D24; stroke-width: 1.8; }
    text { font-family: Georgia, 'Times New Roman', Times, serif; fill: #1F1B16; }
    .h { font-size: 15px; font-weight: bold; }
    .s { font-size: 13px; }
    .i { font-size: 13px; font-style: italic; }
    .band { font-size: 12px; letter-spacing: 3px; fill: #9C3D24; }
    .cap { font-size: 12px; letter-spacing: 2px; }
  </style>

  <!-- paper and frame -->
  <rect x="0" y="0" width="1200" height="1120" fill="#F4EFE3"/>
  <rect x="12" y="12" width="1176" height="1096" class="thin" stroke-width="1.2"/>
  <rect x="18" y="18" width="1164" height="1084" class="thin" stroke-width="0.5"/>

  <!-- header -->
  <text x="600" y="66" text-anchor="middle" font-size="30">FrontierLab · Architecture</text>
  <text x="600" y="94" text-anchor="middle" class="i" font-size="15">Plate I. From Flatland to Spaceland: a question gains dimensions through agents, cross-checked evidence and human review</text>
  <line x1="200" y1="112" x2="1000" y2="112" class="thin"/>

  <!-- ===================== BAND I: FLATLAND ===================== -->
  <text x="40" y="136" class="band">I · FLATLAND — TEXT ON THE PLANE</text>
  <line x1="40" y1="144" x2="1160" y2="144" class="thin" stroke-width="0.5"/>

  <!-- node 1: research question (point) -->
  <circle cx="170" cy="200" r="5" fill="#1F1B16"/>
  <text x="170" y="250" text-anchor="middle" class="h">1 · Research</text>
  <text x="170" y="270" text-anchor="middle" class="s">question, scope,</text>
  <text x="170" y="288" text-anchor="middle" class="s">assumptions</text>

  <!-- node 2: retrieval (pilcrow glyph, not a role shape) -->
  <text x="385" y="214" text-anchor="middle" font-size="34">¶</text>
  <text x="385" y="250" text-anchor="middle" class="h">2 · Evidence retrieval</text>
  <text x="385" y="270" text-anchor="middle" class="s">Europe PMC (app) ·</text>
  <text x="385" y="288" text-anchor="middle" class="s">Springer Nature Meta / OA</text>

  <!-- node 3: Muse2 edge worker (triangle, optional) -->
  <polygon points="600,178 623,218 577,218" class="ink"/>
  <text x="600" y="250" text-anchor="middle" class="h">Muse2-230M edge worker</text>
  <text x="600" y="270" text-anchor="middle" class="i">optional · metadata → strict JSON</text>
  <text x="600" y="288" text-anchor="middle" class="s">no truth or clinical labels</text>

  <!-- node 4: Evidence Extraction Agent (hexagon) -->
  <polygon points="839,199 827,178.2 803,178.2 791,199 803,219.8 827,219.8" class="ink"/>
  <text x="815" y="250" text-anchor="middle" class="h">Evidence Extraction Agent</text>
  <text x="815" y="270" text-anchor="middle" class="s">claims + source ID +</text>
  <text x="815" y="288" text-anchor="middle" class="s">exact quotation</text>

  <!-- node 5: verbatim evidence gate (deterministic gate posts) -->
  <g class="ink">
    <line x1="1020" y1="180" x2="1020" y2="220"/>
    <line x1="1040" y1="180" x2="1040" y2="220"/>
    <line x1="1014" y1="180" x2="1046" y2="180"/>
  </g>
  <text x="1030" y="250" text-anchor="middle" class="h">Verbatim evidence gate</text>
  <text x="1030" y="270" text-anchor="middle" class="s">valid source ID? 24–500-char</text>
  <text x="1030" y="288" text-anchor="middle" class="s">quote found in that abstract?</text>
  <text x="1030" y="308" text-anchor="middle" class="i">no → claim rejected</text>

  <!-- main flow arrows, band I -->
  <line x1="185" y1="200" x2="355" y2="200" class="flow" marker-end="url(#arrow)"/>
  <line x1="415" y1="200" x2="565" y2="200" class="opt"/>
  <polyline points="558,196 566,200 558,204" class="flow" stroke-width="1.3"/>
  <line x1="634" y1="200" x2="781" y2="200" class="opt"/>
  <polyline points="774,196 782,200 774,204" class="flow" stroke-width="1.3"/>
  <line x1="848" y1="200" x2="1004" y2="200" class="flow" marker-end="url(#arrow)"/>
  <!-- Muse2 is optional: the default path goes straight from retrieval to extraction -->
  <path d="M 385 182 V 166 H 815 V 172" class="flow" marker-end="url(#arrow)"/>
  <text x="600" y="160" text-anchor="middle" class="i" font-size="11.5">default path · the edge worker is optional</text>

  <!-- Llama 3.1 8B baseline: comparator under the extraction agent -->
  <line x1="815" y1="296" x2="815" y2="342" class="opt"/>
  <text x="823" y="324" class="i" font-size="11.5">A/B comparison</text>
  <line x1="790" y1="356" x2="840" y2="356" class="ink" stroke-width="2.6"/>
  <line x1="790" y1="350" x2="790" y2="362" class="ink"/>
  <line x1="840" y1="350" x2="840" y2="362" class="ink"/>
  <text x="815" y="388" text-anchor="middle" class="h">Llama 3.1 8B baseline</text>
  <text x="815" y="408" text-anchor="middle" class="i">optional · same JSON contract</text>
  <text x="815" y="426" text-anchor="middle" class="s">receipts marked baseline_only</text>

  <!-- figure / table branch → d1-2B gate (square) -->
  <path d="M 385 298 V 470 H 573" class="opt"/>
  <polyline points="566,466 574,470 566,474" class="flow" stroke-width="1.3"/>
  <text x="480" y="462" text-anchor="middle" class="i" font-size="12">figures · tables · images</text>
  <rect x="580" y="450" width="40" height="40" class="ink"/>
  <text x="600" y="518" text-anchor="middle" class="h">Liquid d1-2B evidence gate</text>
  <text x="600" y="538" text-anchor="middle" class="i">optional · typed relevance / support /</text>
  <text x="600" y="556" text-anchor="middle" class="s">contradiction signals, unthresholded</text>

  <!-- converge on the Sphere -->
  <path d="M 1030 318 V 592 H 612" class="flow"/>
  <text x="1040" y="460" class="i" font-size="12">yes</text>
  <line x1="600" y1="566" x2="600" y2="612" class="flow" marker-end="url(#arrow-accent)"/>

  <!-- ===================== BAND II: THE SPHERE ===================== -->
  <text x="40" y="600" class="band">II · THE SPHERE</text>
  <line x1="40" y1="608" x2="400" y2="608" class="thin" stroke-width="0.5"/>

  <circle cx="600" cy="676" r="58" class="accent"/>
  <ellipse cx="600" cy="676" rx="58" ry="15" class="accent" stroke-width="0.9" stroke-dasharray="3 3"/>
  <ellipse cx="600" cy="676" rx="20" ry="58" class="accent" stroke-width="0.9"/>

  <text x="510" y="648" text-anchor="end" class="h" font-size="17">Human review gate</text>
  <text x="510" y="670" text-anchor="end" class="s">a researcher judges every claim:</text>
  <text x="510" y="688" text-anchor="end" class="s">SUPPORTED · CONTRADICTED · INSUFFICIENT</text>
  <text x="510" y="706" text-anchor="end" class="s">needs ≥ 2 distinct sources supported;</text>
  <text x="510" y="724" text-anchor="end" class="s">bound to source snapshots and the question</text>

  <text x="690" y="652" class="i">The reviewer plays the Sphere: the one</text>
  <text x="690" y="670" class="i">who sees each claim from outside the</text>
  <text x="690" y="688" class="i">plane of text, against its source.</text>
  <text x="690" y="716" class="i">no → synthesis stops</text>

  <!-- ===================== BAND III: SPACELAND ===================== -->
  <path d="M 600 734 V 782 H 178 V 812" class="flow" marker-end="url(#arrow)"/>
  <text x="40" y="770" class="band">III · SPACELAND — REVIEWED, CROSS-CHECKED WORK</text>

  <!-- 3 · Skeptic (hexagon) -->
  <polygon points="200,840 189,821 167,821 156,840 167,859 189,859" class="ink"/>
  <text x="178" y="892" text-anchor="middle" class="h">3 · Skeptic Agent</text>
  <text x="178" y="912" text-anchor="middle" class="s">adversarial: rival</text>
  <text x="178" y="930" text-anchor="middle" class="s">explanations, uncertainty</text>

  <!-- 3 · Hypothesis (hexagon) -->
  <polygon points="377,840 366,821 344,821 333,840 344,859 366,859" class="ink"/>
  <text x="355" y="892" text-anchor="middle" class="h">3 · Hypothesis Agent</text>
  <text x="355" y="912" text-anchor="middle" class="s">≤ 2 falsifiable hypotheses,</text>
  <text x="355" y="930" text-anchor="middle" class="s">cited source IDs only</text>

  <!-- 4 · Evaluation (researcher decision: small sphere) -->
  <circle cx="532" cy="840" r="17" class="accent"/>
  <ellipse cx="532" cy="840" rx="17" ry="5" class="accent" stroke-width="0.8" stroke-dasharray="2 2"/>
  <ellipse cx="532" cy="840" rx="6" ry="17" class="accent" stroke-width="0.8"/>
  <text x="532" y="892" text-anchor="middle" class="h">4 · Method evaluation</text>
  <text x="532" y="912" text-anchor="middle" class="s">researcher compares methods,</text>
  <text x="532" y="930" text-anchor="middle" class="s">reproducibility; selects or defers</text>

  <!-- Planning gate (gate posts, human approval) -->
  <g class="ink">
    <line x1="699" y1="820" x2="699" y2="860"/>
    <line x1="719" y1="820" x2="719" y2="860"/>
    <line x1="693" y1="820" x2="725" y2="820"/>
  </g>
  <text x="709" y="892" text-anchor="middle" class="h">Planning gate</text>
  <text x="709" y="912" text-anchor="middle" class="s">current evaluation +</text>
  <text x="709" y="930" text-anchor="middle" class="s">explicit approval</text>

  <!-- 5 · Plan (cube: the work now has depth) -->
  <g class="ink" stroke-width="1.4">
    <rect x="868" y="828" width="28" height="28"/>
    <polyline points="868,828 880,818 908,818 896,828"/>
    <polyline points="908,818 908,846 896,856"/>
  </g>
  <text x="886" y="892" text-anchor="middle" class="h">5 · Plan draft</text>
  <text x="886" y="912" text-anchor="middle" class="s">controls, metrics,</text>
  <text x="886" y="930" text-anchor="middle" class="s">replication, falsification</text>

  <!-- Audit export -->
  <text x="1063" y="852" text-anchor="middle" font-size="30">{ }</text>
  <text x="1063" y="892" text-anchor="middle" class="h">JSON audit trail</text>
  <text x="1063" y="912" text-anchor="middle" class="s">receipts: role, model ID,</text>
  <text x="1063" y="930" text-anchor="middle" class="s">hashes, timing, tokens</text>

  <!-- band III flow arrows -->
  <line x1="208" y1="840" x2="325" y2="840" class="flow" marker-end="url(#arrow)"/>
  <line x1="385" y1="840" x2="507" y2="840" class="flow" marker-end="url(#arrow)"/>
  <line x1="557" y1="840" x2="684" y2="840" class="flow" marker-end="url(#arrow)"/>
  <line x1="734" y1="840" x2="858" y2="840" class="flow" marker-end="url(#arrow)"/>
  <line x1="916" y1="840" x2="1036" y2="840" class="flow" marker-end="url(#arrow)"/>

  <!-- backend and invalidation notes -->
  <line x1="40" y1="958" x2="1160" y2="958" class="thin" stroke-width="0.5"/>
  <text x="600" y="982" text-anchor="middle" class="s">Hexagon agents call one backend per run: Meta Muse Glimmer 30B via NVIDIA NIM (verified) or Muse Spark Open (optional frontier multimodal).</text>
  <text x="600" y="1000" text-anchor="middle" class="s">Every call has a hard budget and no automatic retries. Changing a source or the question invalidates downstream reviews, hypotheses, evaluations and plans.</text>

  <!-- legend -->
  <text x="40" y="1032" class="cap">KEY</text>
  <circle cx="104" cy="1028" r="4" fill="#1F1B16"/>
  <text x="116" y="1032" class="s">point · question</text>
  <g class="ink" stroke-width="2"><line x1="236" y1="1028" x2="264" y2="1028"/></g>
  <text x="272" y="1032" class="s">line · Llama 3.1 8B baseline</text>
  <polygon points="478,1018 488,1036 468,1036" class="ink" stroke-width="1.3"/>
  <text x="498" y="1032" class="s">triangle · Muse2 edge</text>
  <rect x="650" y="1019" width="18" height="18" class="ink" stroke-width="1.3"/>
  <text x="676" y="1032" class="s">square · d1-2B evidence gate</text>
  <polygon points="894,1028 889,1019.3 879,1019.3 874,1028 879,1036.7 889,1036.7" class="ink" stroke-width="1.3"/>
  <text x="902" y="1032" class="s">hexagon · Glimmer / Spark agents</text>

  <g class="ink" stroke-width="1.3">
    <line x1="99" y1="1052" x2="99" y2="1070"/><line x1="109" y1="1052" x2="109" y2="1070"/><line x1="95" y1="1052" x2="113" y2="1052"/>
  </g>
  <text x="122" y="1066" class="s">posts · deterministic or approval gate</text>
  <circle cx="394" cy="1061" r="10" class="accent" stroke-width="1.3"/>
  <ellipse cx="394" cy="1061" rx="10" ry="3" class="accent" stroke-width="0.7"/>
  <text x="412" y="1066" class="s">Sphere · human review and researcher decisions</text>
  <g class="ink" stroke-width="1.2">
    <rect x="740" y="1056" width="14" height="14"/>
    <polyline points="740,1056 746,1051 760,1051 754,1056"/>
    <polyline points="760,1051 760,1065 754,1070"/>
  </g>
  <text x="768" y="1066" class="s">cube · reviewable plan</text>
  <line x1="912" y1="1061" x2="944" y2="1061" class="opt"/>
  <text x="952" y="1066" class="s">dashed · optional path</text>

  <text x="600" y="1094" text-anchor="middle" class="i" font-size="11.5">Visual homage to Edwin A. Abbott, Flatland: A Romance of Many Dimensions (1884, public domain). Shapes mark roles, not rank.</text>
</svg>
