name: Meta Muse Glimmer via NVIDIA NIM — manual trial
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTTP client dependency
        run: python -m pip install requests
      - name: ONE synthetic-only Meta Muse Glimmer inference via NVIDIA NIM
        env:
          FRONTIERLAB_NVIDIA_TRIAL: 'YES'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python -m scripts.smoke_nvidia_muse
