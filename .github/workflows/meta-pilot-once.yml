name: Authorized one-request Meta 12-case pilot 2026-10-28
on:
  push:
    branches:
      - meta-pilot-once-20261028
    paths:
      - .github/workflows/meta-pilot-once.yml
permissions:
  contents: read
concurrency:
  group: frontierlab-single-meta-pilot-20261028
  cancel-in-progress: false
jobs:
  trial:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'Run authorized one-request 12-case Meta pilot 20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: One joint-context published-excerpt batch; no retries
        env:
          FRONTIERLAB_NVIDIA_TRIAL: 'YES'
          FRONTIERLAB_META_PILOT_TRIAL: 'YES'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python -m scripts.smoke_meta_pilot
