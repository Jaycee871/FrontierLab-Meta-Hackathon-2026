name: Authorized one-time Meta JSON trial 2026-10-28
on:
  push:
    branches:
      - meta-json-once-20261028
    paths:
      - .github/workflows/meta-json-once.yml
permissions:
  contents: read
concurrency:
  group: frontierlab-single-meta-json-20261028
  cancel-in-progress: false
jobs:
  trial:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'Run explicitly authorized single Meta JSON trial 20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: One published-excerpt JSON request; no retry
        env:
          FRONTIERLAB_NVIDIA_TRIAL: 'YES'
          FRONTIERLAB_META_JSON_TRIAL: 'YES'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python -m scripts.smoke_meta_json
