name: Meta Muse Glimmer — bounded reviewed continuation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontierlab-nim-reviewed-continuation
  cancel-in-progress: false

jobs:
  continue-reviewed-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      FRONTIERLAB_NIM_RESEARCH: "YES"
      FRONTIERLAB_CONTINUATION_TRIAL: "YES"

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Continue reviewed run with two-call hard cap
        run: python -m scripts.nim_research_continue_trial > nim_reviewed_continuation.json

      - name: Preserve non-secret run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nim-reviewed-continuation-${{ github.run_id }}
          path: nim_reviewed_continuation.json
          if-no-files-found: ignore
          retention-days: 30
