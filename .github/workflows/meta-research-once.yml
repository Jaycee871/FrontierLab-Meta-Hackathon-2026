name: Authorized two-excerpt Meta research extraction 2026-10-28
on:
  push:
    branches:
      - meta-research-once-20261028
    paths:
      - .github/workflows/meta-research-once.yml
permissions:
  contents: read
concurrency:
  group: frontierlab-single-research-extraction-20261028
  cancel-in-progress: false
jobs:
  trial:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'Run authorized two-excerpt Meta research extraction 20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: At most two extraction calls then stop before human review
        env:
          FRONTIERLAB_NIM_RESEARCH: 'YES'
          FRONTIERLAB_EXTRACTION_TRIAL: 'YES'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python -m scripts.nim_research_extract_trial
