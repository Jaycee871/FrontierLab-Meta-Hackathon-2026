name: Maintenance canary\n\non:\n  workflow_dispatch:\n  schedule:\n    - cron: "17 2 * * *"\n  push:\n    paths:\n      - "requirements.txt"\n      - "requirements-dev.txt"\n      - "frontierlab/**"\n      - "scripts/maintenance_canary.py"\n      - ".github/workflows/maintenance-canary.yml"\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: frontierlab-maintenance-canary\n  cancel-in-progress: false\n\njobs:\n  canary:\n    runs-on: ubuntu-latest\n    timeout-minutes: 15\n    steps:\n      - uses: actions/checkout@v4\n\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.11"\n\n      - name: Install current dependency range\n        run: python -m pip install -r requirements-dev.txt\n\n      - name: Run regression tests and preserve exit code\n        id: regress\n        shell: bash\n        run: |\n          set +e\n          python -m pytest -q 2>&1 | tee pytest.log\n          code=${PIPESTATUS[0]}\n          echo "exit_code=$code" >> "$GITHUB_OUTPUT"\n          set -e\n\n      - name: Build maintenance health record\n        if: always()\n        run: |\n          python -m scripts.maintenance_canary \\n            --pytest-exit-code "${{ steps.regress.outputs.exit_code || 1 }}" \\n            --pytest-log pytest.log \\n            --trigger "${{ github.event_name }}" \\n            > maintenance_health.json\n\n      - name: Upload maintenance evidence\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: maintenance-canary-${{ github.run_id }}\n          path: |\n            maintenance_health.json\n            pytest.log\n          if-no-files-found: error\n          retention-days: 30\n\n      - name: Enforce quarantine on regression failure\n        if: always()\n        shell: bash\n        run: |\n          code="${{ steps.regress.outputs.exit_code || 1 }}"\n          if [ "$code" -ne 0 ]; then\n            echo "Regression failure detected. Revision/environment requires quarantine and human-approved repair."\n            exit "$code"\n          fi